<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <title>Ramen Nagi Menu</title>    
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, sans-serif;
            background-image: url('https://i.pinimg.com/736x/c6/44/37/c64437c68f7b59a3dab898401a745bb7.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 30px;
            color: #e40404;
}

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #bc002d;
            font-size: 32px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 16px;
            color: #666;
            margin: 0;
        }

        .menu-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

       .card {
            background-color: rgba(85, 10, 10, 0.7); /* asked gemini for help on this part because i forgot how to do the opacity settings */
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            width: 180px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
}

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .item-name {
            font-size: 16px;
            font-weight: bold;
            margin: 5px 0;
        }

        .item-price {
            font-size: 14px;
            color: #e63946;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-container {
            text-align: center;
            margin-top: 30px;
        }

        .order-btn {
            background-color: #bc002d;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .order-btn:hover {
            background-color: #8b0021;
        }

        #receipt {
            max-width: 400px;
            margin: 30px auto 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #bc002d;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>RAMEN NAGI</h1>
        <p>Universal Noodle Creator — Menu</p>
    </div>

    <form>
        <div class="menu-grid">
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9v_BWSXjv27qun_hAKX4hwG0tAjNmjsBGFtpPl5urwAYFQC4AGXgJefhU&s=10" alt="Butao King">
                <div class="item-name">Butao King</div>
                <div class="item-price">₱445.00</div>
                <label class="checkbox-container">
                    <input type="checkbox" id="butao" value="445">
                    Select
                </label>
            </div>

            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSNiAlyGNge9lIlVLsvJzOmk3OuJ_3sLpKY_iC6zMck-XQ9escfnpDtNSY&s=10" alt="Black King">
                <div class="item-name">Black King</div>
                <div class="item-price">₱545.00</div>
                <label class="checkbox-container">
                    <input type="checkbox" id="black_king" value="545">
                    Select
                </label>
            </div>

            <div class="card">
                <img src="https://i.redd.it/ramen-nagis-red-king-lv-10-v0-vdm13bgs81re1.jpg?width=2251&format=pjpg&auto=webp&s=dd633885c3410abe482d5a16e0c2a8c506a3f0b8" alt="Red King">
                <div class="item-name">Red King</div>
                <div class="item-price">₱545.00</div>
                <label class="checkbox-container">
                    <input type="checkbox" id="red_king" value="545">
                    Select
                </label>
            </div>

            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSV2sXp1etDFoTYnAvMxY94R6JutORkAzWeMppn25e8RkuDqNx4syn7jaES&s=10" alt="Green King">
                <div class="item-name">Green King</div>
                <div class="item-price">₱545.00</div>
                <label class="checkbox-container">
                    <input type="checkbox" id="green_king" value="545">
                    Select
                </label>
            </div>

            <div class="card">
                <img src="https://images.summitmedia-digital.com/spotph/images/2020/02/25/ramennagi-obhs-12-1582560391.jpg" alt="Nagi Gyoza">
                <div class="item-name">Classic Gyoza</div>
                <div class="item-price">₱180.00</div>
                <label class="checkbox-container">
                    <input type="checkbox" id="gyoza" value="180">
                    Select
                </label>
            </div>

            <div class="card">
                <img src="https://ever.ph/cdn/shop/files/9000002359-Coke-Coca-Cola-Original-Taste-Can-320ml-230206.jpg?v=1676528484" alt="Coke">
                <div class="item-name">Coke</div>
                <div class="item-price">₱80.00</div>
                <label class="checkbox-container">
                    <input type="checkbox" id="coke" value="80">
                    Select
                </label>
            </div>

        </div>

        <div class="btn-container">
            <input type="button" class="order-btn" py-click="create_order" value="Create Order">
        </div>
    </form>

    <div id="receipt"></div>
  <py-script src="main.py"></py-script>

</body>
</html>
